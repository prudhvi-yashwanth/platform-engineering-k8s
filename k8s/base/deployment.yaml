apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: go-api

  template:
    metadata:
      labels:
        app: go-api

    spec:
      containers:
        - name: go-api
          image: hashicorp/http-echo

          args:
            - "-text=go-api working"
            - "-listen=:5678"

          ports:
            - containerPort: 5678
