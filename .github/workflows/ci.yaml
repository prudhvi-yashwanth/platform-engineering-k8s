name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker version

      - name: Verify kubectl
        run: kubectl version --client

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Verify Go
        run: |
          unset GOROOT
          hash -r
          which go
          go version

      - name: Download dependencies
        working-directory: app
        run: |
          unset GOROOT
          go mod download

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
          --load \
          -t go-api:${{ github.sha }} .
          
      - name: Verify Docker image
        run: docker images

      - name: Scan Docker image with Trivy
        run: |
          trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          go-api:${{ github.sha }}

      - name: Run unit tests
        working-directory: app
        run: |
          unset GOROOT
          go test ./...

      - name: Build Docker image
        working-directory: app
        run: docker build -t go-api:${{ github.sha }} .