name: Go API CI

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker version

      - name: Verify kubectl
        run: kubectl version --client

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Verify Go
        run: go version

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Build application 
        working-directory: app
        run: go build -o go-api ./cmd/api/main.go