name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: |
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
        
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Verify Docker image exists
        run: |
          docker images | grep $IMAGE_TAG

      - name: Import image into k3d
        run: |
          k3d image import go-api:$IMAGE_TAG -c dev-platform

      - name: Update deployment image
        run: |
          kubectl set image deployment/go-api \
          go-api=go-api:$IMAGE_TAG \
          -n dev

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/go-api -n dev